services:
  mysql:
    image: mysql:8.4
    container_name: crumb-co-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: crumb_co_bakery
    ports:
      - "3306:3306"
    volumes:
      - crumb_co_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  crumb_co_mysql_data:
